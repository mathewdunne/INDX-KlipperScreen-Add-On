#####################################################################
#  INDX KlipperScreen add-on: companion macros
#
#  Include AFTER the INDX macros (indx/*.cfg) in printer.cfg:
#
#    [include indx_companion.cfg]
#
#  Needs [save_variables] and [respond], which INDX already requires.
#  Spoolman is optional; the spool macros only talk to Moonraker when a
#  spool is actually assigned.
#
#  Per-tool state, all in save_variables:
#    t<n>_fil_density   set by LOAD_FILAMENT; not null = loaded (upstream)
#    t<n>_fil_type      material, recorded on load or set by hand
#    t<n>_fil_color     hex colour without '#', set by hand
#    t<n>__spool_id     Spoolman spool; the same variable Mainsail writes
#
#  This file may be distributed under the terms of the GNU GPLv3 license.
#####################################################################


#####################################################################
#  FILAMENT UNLOADING
#####################################################################
#
#    UNLOAD_FILAMENT TOOL=<n> [TEMP=<c>]
#
#  Picks up TOOL=n if it is not already mounted, then rams and retracts
#  the filament 85 mm, clear of the nozzle and the DX gears. Heat the
#  tool first, or pass TEMP=<c>; without either it refuses to run.
#
#  The sequence is Prusa's Core ONE INDX unload (Prusa-Firmware-Buddy
#  v6.10.1: pause.cpp unload_purge + standard_ramming_sequence_indx.cpp
#  unload + FILAMENT_CHANGE_UNLOAD_LENGTH) plus 30 mm more: Prusa's 55 mm
#  left the filament in the gears on a Trident (2026-09-17). The +2 mm
#  purge at the start is not optional: the latch is only partially
#  engaged after a pickup, and a retract before ~1.2 mm of extrusion
#  drops the tool.
#
#  Afterwards the filament is free of the gears: pull the rest out by
#  hand from the spool end. Not tuned for flexible filament.
#
#  Also forgets the tool's material, colour and Spoolman spool.
#
#####################################################################

[gcode_macro UNLOAD_FILAMENT]
description: Pick up TOOL=n if needed, ram and retract the filament 85 mm out of the tool. Heat first or pass TEMP=<c>.
gcode:
    {% if 'TOOL' not in params %}
        {action_raise_error("Usage: UNLOAD_FILAMENT TOOL=<n> [TEMP=<c>]")}
    {% endif %}
    {% set t   = params.TOOL|int %}
    {% set svv = printer.save_variables.variables %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}

    # Unload temperature: TEMP= wins, else the recorded material's preset, else the current target
    {% set presets = printer["gcode_macro LOAD_FILAMENT"].filament_presets %}
    {% set ftype = svv["t" ~ t ~ "_fil_type"]|default("", true)|upper %}
    {% if 'TEMP' in params %}
        {% set temp = params.TEMP|float %}
    {% elif ftype in presets %}
        {% set temp = presets[ftype]['temp']|float %}
    {% else %}
        {% set temp = printer.extruder.target|float %}
    {% endif %}
    {% if temp < min_temp %}
        {action_raise_error("UNLOAD_FILAMENT: no unload temperature. Heat the tool first or pass TEMP=<c> (min %d)." % min_temp)}
    {% endif %}

    # 1. Pick up the tool if it is not mounted (CHANGE_TOOL reheats it to TEMP)
    {% if act != t %}
        CHANGE_TOOL TOOL={t} TEMP={temp}
    {% endif %}

    # 2. Heat and wait (no-op if CHANGE_TOOL already did)
    RESPOND MSG="UNLOAD_FILAMENT: heating T{t} to {temp|int} C..."
    M104 S{temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 3} MAXIMUM={temp + 3}

    # 3. Purge, ram, retract. Feedrates are Prusa's, in mm/min.
    SAVE_GCODE_STATE NAME=indx_unload
    M83
    G1 E2   F180    # unload_purge: fill the nozzle, finish latch engagement
    G1 E8   F1500   # first ramming
    G1 E8   F1200
    G1 E-20 F2100
    G1 E-3  F60     # cooling moves
    G1 E3   F120
    G1 E19  F1800   # second ramming
    G1 E2   F600
    G1 E-20 F2100
    G1 E-3  F120    # cooling moves
    G1 E3   F120
    G1 E-6  F120    # tip cooling before retraction
    G1 E-8  F360
    G1 E-21 F900    # rest of Prusa's 55 mm unload length
    G1 E-30 F900    # a bit extra to ensure it clears the gears
    M400
    RESTORE_GCODE_STATE NAME=indx_unload

    # 4. Forget the filament: live thermal model now, and the per-tool record
    #    that _APPLY_TOOL_FILAMENT would otherwise restore on the next pickup.
    #    INDX_SET_MODEL_PARAMS rather than INDX_CLEAR_FILAMENT: same live effect,
    #    but no SAVE_CONFIG staged, so no Save & Restart prompt.
    INDX_SET_MODEL_PARAMS FILAMENT_DENSITY=0 FILAMENT_HEAT_CAPACITY=0
    SAVE_VARIABLE VARIABLE=t{t}_fil_density VALUE=None
    SAVE_VARIABLE VARIABLE=t{t}_fil_hc VALUE=None
    SAVE_VARIABLE VARIABLE=t{t}_fil_type VALUE=None
    SAVE_VARIABLE VARIABLE=t{t}_fil_color VALUE=None
    {% if svv["t" ~ t ~ "__spool_id"]|default(none, true) is not none %}
        INDX_SET_SPOOL TOOL={t} SPOOL=0
    {% endif %}
    RESPOND MSG="UNLOAD_FILAMENT: T{t} filament is clear of the gears. Pull the rest out from the spool end."


#####################################################################
#  PER-TOOL FILAMENT AND SPOOL
#####################################################################

[gcode_macro INDX_SET_FILAMENT]
description: Record the material and/or colour in TOOL=n by hand, shown when no Spoolman spool is assigned. MATERIAL=PLA COLOR=FF8000
gcode:
    {% if 'TOOL' not in params %}
        {action_raise_error("Usage: INDX_SET_FILAMENT TOOL=<n> [MATERIAL=<type>] [COLOR=<hex>]")}
    {% endif %}
    {% set t = params.TOOL|int %}
    {% set m = params.MATERIAL|default("")|upper %}
    {% set c = params.COLOR|default("")|upper|replace("#", "") %}
    {% if m %}
        SAVE_VARIABLE VARIABLE=t{t}_fil_type VALUE='"{m}"'
    {% endif %}
    {% if c %}
        SAVE_VARIABLE VARIABLE=t{t}_fil_color VALUE='"{c}"'
    {% endif %}

[gcode_macro INDX_SET_SPOOL]
description: Assign Spoolman spool SPOOL=id to TOOL=n, SPOOL=0 to unassign. Writes the same variables as Mainsail.
gcode:
    {% if 'TOOL' not in params %}
        {action_raise_error("Usage: INDX_SET_SPOOL TOOL=<n> SPOOL=<id, 0 to unassign>")}
    {% endif %}
    {% set t = params.TOOL|int %}
    {% set sid = params.SPOOL|default(0)|int %}
    {% set value = sid if sid > 0 else "None" %}
    {% set svv = printer.save_variables.variables %}
    {% set prev = svv["t" ~ t ~ "__spool_id"]|default(none, true) %}
    SAVE_VARIABLE VARIABLE=t{t}__spool_id VALUE={value}
    # Mainsail reads the spool from T<n>.spool_id when the macro declares it
    {% set tmacro = "gcode_macro T" ~ t %}
    {% if tmacro in printer and printer[tmacro].spool_id is defined %}
        SET_GCODE_VARIABLE MACRO=T{t} VARIABLE=spool_id VALUE={value}
    {% endif %}
    # The mounted tool's spool is the active one
    {% if svv.active_tool|default(-1)|int == t %}
        {% if sid > 0 %}
            _INDX_ACTIVE_SPOOL ID={sid}
        {% elif prev is not none %}
            _INDX_ACTIVE_SPOOL ID=0
        {% endif %}
    {% endif %}

[gcode_macro _INDX_TOOLCHANGE_SPOOL]
description: Hook for the toolchange macros: make TOOL=n's spool the active one, TOOL=-1 when nothing is mounted
gcode:
    {% set t = params.TOOL|default(-1)|int %}
    {% set svv = printer.save_variables.variables %}
    {% set sid = svv["t" ~ t ~ "__spool_id"]|default(0, true)|int if t >= 0 else 0 %}
    # Only clear when some tool has a spool, so printers without Spoolman never call it
    {% set ns = namespace(any=false) %}
    {% for k in svv if k.endswith("__spool_id") and svv[k] %}
        {% set ns.any = true %}
    {% endfor %}
    {% if sid > 0 or ns.any %}
        _INDX_ACTIVE_SPOOL ID={sid}
    {% endif %}

[gcode_macro _INDX_ACTIVE_SPOOL]
description: Inner: set Moonraker's active Spoolman spool, ID=0 clears it
gcode:
    {% set sid = params.ID|default(0)|int %}
    {% if sid > 0 %}
        {action_call_remote_method("spoolman_set_active_spool", spool_id=sid)}
    {% else %}
        {action_call_remote_method("spoolman_set_active_spool", spool_id=None)}
    {% endif %}

# Put each T<n>.spool_id back after a restart, for Mainsail
[delayed_gcode _INDX_RESTORE_SPOOLS]
initial_duration: 0.2
gcode:
    {% set svv = printer.save_variables.variables %}
    {% for t in range(printer["gcode_macro TOOL_POSITIONS"].tool_count|int) %}
        {% set tmacro = "gcode_macro T" ~ t %}
        {% set var = "t" ~ t ~ "__spool_id" %}
        {% if tmacro in printer and printer[tmacro].spool_id is defined and var in svv %}
            SET_GCODE_VARIABLE MACRO=T{t} VARIABLE=spool_id VALUE={svv[var]}
        {% endif %}
    {% endfor %}


#####################################################################
#  TOUCHSCREEN PICKERS (Klipper action:prompt dialogs)
#  Work in Mainsail, KlipperScreen and HelixScreen. Body buttons do
#  not close the dialog, so every action goes through a _GO wrapper.
#####################################################################

[gcode_macro INDX_LOAD]
description: Pick a tool, then a material, then LOAD_FILAMENT
gcode:
    {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|int %}
    RESPOND TYPE=command MSG="action:prompt_begin Load filament: which tool?"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for t in range(n) %}
        RESPOND TYPE=command MSG="action:prompt_button T{t}|_INDX_LOAD_PICK TOOL={t}|primary"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _INDX_LOAD_PICK]
description: Inner: material prompt for TOOL=n
gcode:
    {% set t = params.TOOL|int %}
    {% set presets = printer["gcode_macro LOAD_FILAMENT"].filament_presets %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Load T{t}: which material?"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for m in presets %}
        RESPOND TYPE=command MSG="action:prompt_button {m} {presets[m]['temp']}C|_INDX_LOAD_GO TOOL={t} TYPE={m}|primary"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|error"
    RESPOND TYPE=command MSG="action:prompt_show"

# Records the material after a successful load; console LOAD_FILAMENT does not
[gcode_macro _INDX_LOAD_GO]
gcode:
    {% set t = params.TOOL|int %}
    {% set type = params.TYPE|upper %}
    RESPOND TYPE=command MSG="action:prompt_end"
    LOAD_FILAMENT TOOL={t} TYPE={type}
    SAVE_VARIABLE VARIABLE=t{t}_fil_type VALUE='"{type}"'

[gcode_macro INDX_UNLOAD]
description: Pick a loaded tool, then UNLOAD_FILAMENT
gcode:
    {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|int %}
    {% set svv = printer.save_variables.variables %}
    RESPOND TYPE=command MSG="action:prompt_begin Unload filament: which tool?"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for t in range(n) %}
        {% if svv["t" ~ t ~ "_fil_density"]|default(none, true) is not none %}
            {% set ft = svv["t" ~ t ~ "_fil_type"]|default("", true) %}
            RESPOND TYPE=command MSG="action:prompt_button T{t} {ft}|_INDX_UNLOAD_GO TOOL={t}|primary"
        {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _INDX_UNLOAD_GO]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    UNLOAD_FILAMENT TOOL={params.TOOL|int}

[gcode_macro INDX_TOGGLE]
description: TOOL=n: unload if it has filament, otherwise ask for a material and load
gcode:
    {% set t = params.TOOL|int %}
    {% set svv = printer.save_variables.variables %}
    {% if svv["t" ~ t ~ "_fil_density"]|default(none, true) is not none %}
        UNLOAD_FILAMENT TOOL={t}
    {% else %}
        _INDX_LOAD_PICK TOOL={t}
    {% endif %}
