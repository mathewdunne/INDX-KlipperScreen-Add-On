[menu __print indx]
name: INDX
icon: indx
panel: indx

# Panel buttons
# -------------
# Each button runs a Moonraker method, printer.gcode.script by default.
# To change one, add a section for it to KlipperScreen.conf; any option you
# leave out keeps its default. In params the panel replaces {tool} (0..7),
# {spool} (Spoolman ID, 0 = unassign), {material} and {color} (hex, no #).
#
# Actions and their defaults:
#
# [menu indx pickup]
# name: Pick up
# icon: extruder
# method: printer.gcode.script
# params: {"script": "T{tool}"}
#
# [menu indx load]
# name: Load
# icon: load
# params: {"script": "_INDX_LOAD_PICK TOOL={tool}"}
#
# [menu indx unload]
# name: Unload
# icon: retract
# params: {"script": "UNLOAD_FILAMENT TOOL={tool}"}
#
# [menu indx spool]
# name: Spool
# icon: spoolman
# params: {"script": "INDX_SET_SPOOL TOOL={tool} SPOOL={spool}"}
#
# [menu indx filament]
# name: Colour
# icon: fine-tune
# params: {"script": "INDX_SET_FILAMENT TOOL={tool} MATERIAL={material} COLOR={color}"}
#
# [menu indx park]
# name: Park
# icon: toolchanger
# params: {"script": "PARK_TOOL"}
#
# Recovery sub-view ({tool} in name is replaced too):
#
# [menu indx seat]
# name: Seat T{tool} by hand
# icon: lock
# params: {"script": "MANUAL_TOOL_SEAT TOOL={tool}"}
#
# [menu indx remove]
# name: Remove tool by hand
# icon: arrow-down
# params: {"script": "MANUAL_TOOL_REMOVE"}
#
# [menu indx reset]
# name: Reset toolhead
# icon: refresh
# params: {"script": "MANUAL_TOOLHEAD_RESET"}
