<g stroke-width="28">
<use href="#head-tool"/>
<g mask="url(#hollow)">
<use href="#dock-tool" x="312" y="156"/>
<use href="#dock-tool" x="436" y="156"/>
</g>
</g>
<g stroke="none">
<rect x="0" y="274" width="18" height="48" rx="6"/>
<rect x="246" y="274" width="24" height="48" rx="6"/>
<rect x="362" y="274" width="24" height="48" rx="6"/>
<rect x="488" y="274" width="24" height="48" rx="6"/>
</g>
</g>
<g fill="#a3262e">
<circle cx="128" cy="290" r="24"/>
